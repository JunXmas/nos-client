// Fabric mod client-side cho Minecraft 1.21.11.
//
// 1.21.11 vẫn là bản CÒN obfuscate, nên phải dùng plugin `fabric-loom-remap`
// (KHÔNG phải `fabric-loom` thường — bản đó dành cho runtime không-obfuscate 26.1+,
// xuất jar tên Mojang và sẽ NoClassDefFoundError khi loader nạp trên intermediary).
// Loom jar đăng ký cả hai plugin id nên nạp qua buildscript rồi apply đúng id.
buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		gradlePluginPortal()
		mavenCentral()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

apply plugin: 'net.fabricmc.fabric-loom-remap'

base {
	archivesName = 'nosclient'
}

repositories {
	// loom tự thêm maven của Mojang/Fabric.
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"nosclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	// Dev map = tên Mojang (Minecraft, EndCrystal, ...); loom remap jar sang intermediary.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Small JVM regressions for client settings/storage/queues without booting Minecraft.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.runtimeClasspath
tasks.named('test') { useJUnitPlatform() }

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

// Game 1.21.11 chạy Java 21 -> bytecode phải ≤ 21.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('THIRD_PARTY_NOTICES.md')
	from('LICENSE') {
		rename { "${it}_${project.name}" }
	}
}

// Mod kiểm thử riêng, không đưa vào jar phát hành.
sourceSets {
    verification {
        java.srcDir 'checks/game/java'
        resources.srcDir 'checks/game/resources'
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
        runtimeClasspath += compileClasspath
    }
}
tasks.register('verificationJar', Jar) {
    dependsOn tasks.named('verificationClasses')
    archiveClassifier = 'verification-dev'
    destinationDirectory = layout.buildDirectory.dir('verification')
    from sourceSets.verification.output
}
tasks.register('remapVerificationJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('verificationJar')
    inputFile = tasks.named('verificationJar').flatMap { it.archiveFile }
    archiveClassifier = 'verification'
    destinationDirectory = layout.buildDirectory.dir('verification')
}

tasks.register('writeVerificationClasspath') {
    dependsOn tasks.named('clientClasses')
    doLast {
        def target = layout.buildDirectory.file('verification/client-classpath.txt').get().asFile
        target.parentFile.mkdirs()
        target.text = sourceSets.client.runtimeClasspath.asPath
    }
}
