name: CI

on:
  push:
    branches: [master, main, integrate/nos-0.4.0]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./gradlew build test remapVerificationJar --no-daemon
        shell: bash
      - run: python checks/localization.py
      - uses: actions/upload-artifact@v4
        with:
          name: nos-client-${{ matrix.os }}
          path: |
            build/libs/nosclient-0.4.2.jar
            build/reports/tests/test/
